name: CI

# Runs on every pull request into main (the quality gate) and on every push to main
# (so the badge/history reflects what's actually on the deploy branch too). Deployment
# itself is handled by the hosting provider's own git integration, not a step in this
# file -- see the README's Deployment & CI/CD section for why, and exactly what that
# means main is protected by.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint needs the full history to diff the PR's commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types (tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

  commitlint:
    name: Commit messages (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint every commit added in this PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
